services:
  - type: web
    name: elitecruit-app
    runtime: node
    plan: free
    buildCommand: npm --prefix Frontend install && npm --prefix Frontend run build && npm --prefix Backend install
    startCommand: node Backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elitecruit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: elitecruit-db
    plan: free
    databaseName: elitecruit
    user: elitecruit_user
