services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elitecruit_app
    restart: unless-stopped
    ports:
      - "5400:5400"
    environment:
      - NODE_ENV=production
      - PORT=5400
      - DATABASE_URL=postgresql://elitecruit_user:elitecruit_secure_password@db:5432/elitecruit
      - DATABASE_SSL=false
      - JWT_SECRET=replace_with_a_secure_random_64_char_string_for_production
      - ADMIN_INITIAL_EMAIL=admin@yourdomain.com
      - ADMIN_INITIAL_PASSWORD=AdminProductionPassword123!
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-google-app-password
      - SMTP_FROM="EliteCruit Security" <your-email@gmail.com>
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: elitecruit_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=elitecruit
      - POSTGRES_USER=elitecruit_user
      - POSTGRES_PASSWORD=elitecruit_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitecruit_user -d elitecruit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
